services:
  - type: web
    name: sourcept-portal
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app app init-db
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sourcept-db
          property: connectionString

databases:
  - name: sourcept-db
    plan: basic-256mb

